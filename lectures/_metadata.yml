institute: "Kühne Logistics University Hamburg - Winter 2025"
format:
  html: default
  typst: default
  revealjs:
    # One stage for every course: 16:9 (Lecture-Foundations, research/slide-sizes.md).
    width: 1280
    height: 720
    include-in-header:
      - ../general/mathjax.html
    theme:
      - default
      - ../styles.scss
      - brand
    transition: slide
    callout-appearance: simple
    transition-speed: fast
    syntax-highlighting: ../_paper-and-ink-light.theme
    slide-number: true
    code-copy: true
    code-link: true
    preview-links: auto

format-links:
  - html
  - format: typst
    text: PDF
    icon: file-pdf
  - revealjs

execute:
  echo: true
